# Orqafy Self-Hosted — dev infra tier (Valkey, MinIO + console, MailHog, pgAdmin).
# Phase 4 Part 7. Dev only, HARD HOLD. Rule-22 ports from .env.dev.
# The named network/volumes are declared in docker-compose.db.yml (external here).

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: orqafy_dev_valkey
    restart: "no"
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    ports:
      - "${VALKEY_PORT}:6379" # REDIS_URL — BullMQ backend
    volumes:
      - orqafy_dev_valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - orqafy_dev_net

  minio:
    image: minio/minio:latest
    container_name: orqafy_dev_minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT}:9001" # web console
    volumes:
      - orqafy_dev_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - orqafy_dev_net

  # One-shot: create the app bucket, then exit 0. Safe to re-run.
  minio-init:
    image: minio/mc:latest
    container_name: orqafy_dev_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      echo 'bucket ${S3_BUCKET} ready'
      "
    networks:
      - orqafy_dev_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: orqafy_dev_mailhog
    restart: "no"
    ports:
      - "${MAILHOG_SMTP_PORT}:1025" # SMTP capture
      - "${MAILHOG_UI_PORT}:8025" # web UI
    networks:
      - orqafy_dev_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: orqafy_dev_pgadmin
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Allow the dev `.local` login email — pgAdmin's email validator rejects
      # reserved TLDs unless the deliverability check is off.
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_CONFIG_GLOBALLY_DELIVERABLE: "False"
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: '["local"]'
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - orqafy_dev_pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - orqafy_dev_net

volumes:
  orqafy_dev_valkey:
    name: orqafy_dev_valkey
  orqafy_dev_minio:
    name: orqafy_dev_minio
  orqafy_dev_pgadmin:
    name: orqafy_dev_pgadmin

networks:
  orqafy_dev_net:
    name: orqafy_dev_net
